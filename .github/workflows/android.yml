name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk Portario-0.1.0-debug.apk
          sha256sum Portario-0.1.0-debug.apk > Portario-0.1.0-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Portario-debug
          path: |
            Portario-0.1.0-debug.apk
            Portario-0.1.0-debug.apk.sha256
