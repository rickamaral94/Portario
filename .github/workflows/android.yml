name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk Portario-0.1.0-debug.apk
          sha256sum Portario-0.1.0-debug.apk > Portario-0.1.0-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Portario-debug
          path: |
            Portario-0.1.0-debug.apk
            Portario-0.1.0-debug.apk.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          PORTARIO_NETWORK_SMOKE: '1'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest && bash scripts/smoke-android.sh Portario-0.1.0-debug.apk screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Portario-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
      - run: ./gradlew lintDebug
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Portario-lint
          path: app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
